<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #ffffff;
            color: #202124;
        }

        /* Top Navigation Bar */
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 16px 24px;
            gap: 15px;
        }

        header a {
            color: rgba(0, 0, 0, 0.87);
            text-decoration: none;
            font-size: 14px;
        }

        header a:hover {
            text-decoration: underline;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background-color: #f1f3f4;
        }

        .profile-btn {
            width: 32px;
            height: 32px;
            background-color: #1a73e8;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        /* Main Search Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 100px;
        }

        .logo {
            font-size: 90px;
            font-weight: bold;
            letter-spacing: -3px;
            margin-bottom: 20px;
            user-select: none;
            font-family: 'Product Sans', Arial, sans-serif;
        }

        .logo span:nth-child(1) { color: #4285f4; }
        .logo span:nth-child(2) { color: #ea4335; }
        .logo span:nth-child(3) { color: #fbbc05; }
        .logo span:nth-child(4) { color: #4285f4; }
        .logo span:nth-child(5) { color: #34a853; }
        .logo span:nth-child(6) { color: #ea4335; }

        /* Search Box Bar */
        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 584px;
            height: 46px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 14px;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .search-box:hover,
        .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            border-color: rgba(223, 225, 229, 0);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            fill: #9aa0a6;
            margin-right: 12px;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: #202124;
            background: transparent;
        }

        .action-icons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-icons svg {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        /* Buttons Group */
        .button-group {
            margin-top: 28px;
            display: flex;
            gap: 12px;
        }

        .button-group button {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .button-group button:hover {
            border-color: #dadce0;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
            color: #202124;
        }

        /* Footer */
        footer {
            background-color: #f2f2f2;
            color: #70757a;
            font-size: 14px;
        }

        .footer-location {
            padding: 15px 30px;
            border-bottom: 1px solid #dadce0;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            padding: 15px 30px;
        }

        .footer-links-group {
            display: flex;
            gap: 30px;
        }

        .footer-links a {
            color: #70757a;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .footer-links {
                justify-content: center;
                gap: 20px;
            }
            .footer-links-group {
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        
        <!-- App Grid Icon -->
        <button class="icon-btn" title="Google apps">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#5f6368">
                <path d="M6 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm8 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm8 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM6 14c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm8 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm8 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM6 20c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm8 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm8 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
            </svg>
        </button>

        <div class="profile-btn" title="Account">A</div>
    </header>

    <main>
        <div class="logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div>

        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" title="Search" autofocus>
            <div class="action-icons">
                <!-- Voice Search Icon -->
                <svg viewBox="0 0 24 24" title="Search by voice">
                    <path fill="#4285f4" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path fill="#34a853" d="M11 18.92W11 22h2v-3.08c3.39-.49 6-3.4 6-6.92h-2c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.52 2.61 6.43 6 6.92z"/>
                </svg>
            </div>
        </div>

        <div class="button-group">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div>
    </main>

    <footer>
        <div class="footer-location">United States</div>
        <div class="footer-links">
            <div class="footer-links-group">
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
          <div class="footer-links-group">
    <a href="cipher.html">Privacy</a>
    <a href="#">Terms</a>
    <a href="#">Settings</a>
      </div>
        </div>
    </footer>

</body>
</html>
