<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecretMessages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Secret Messages</h1>

    <div class="input-container" style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 20px; width: 100%;">
        <!-- Key emoji links to Arcade Menu -->
        <a href="arcade.html" title="Open Arcade" style="text-decoration: none; cursor: pointer;">
            <span style="font-size: 1.5rem;">🔑</span>
        </a>

        <div style="display: flex; width: 100%; gap: 8px; align-items: center;">
            <input
                type="password"
                id="key"
                placeholder="Enter Secret Key"
                style="margin: 0; flex: 1; min-height: 44px; font-size: 16px; box-sizing: border-box;"
            >

            <button
                type="button"
                id="toggleKeyBtn"
                onclick="toggleKeyVisibility()"
                style="
                    flex: 0 0 auto;
                    min-height: 44px;
                    padding: 0 16px;
                    font-size: 14px;
                    cursor: pointer;
                    user-select: none;
                    -webkit-user-select: none;
                    touch-action: manipulation;
                    -webkit-tap-highlight-color: transparent;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                "
                title="Toggle Key Visibility"
            >
                Show
            </button>
        </div>
    </div>

    <div class="input-container" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 20px;">
        <span style="font-size: 1.5rem;">💬</span>
        <textarea
            id="input"
            placeholder="Input Message"
            style="margin: 0; width: 100%; box-sizing: border-box;"
        ></textarea>
    </div>

    <div class="buttons" style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;">
        <button onclick="encryptMessage()">Encrypt</button>
        <button onclick="decryptMessage()">Decrypt</button>
        <button onclick="clearAll()">Clear</button>
    </div>

    <div class="input-container" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 20px;">
        <!-- Lock emoji links to Arcade Menu -->
        <a href="arcade.html" title="Open Arcade" style="text-decoration: none; cursor: pointer;">
            <span style="font-size: 1.5rem;">🔒</span>
        </a>
        <textarea
            id="output"
            readonly
            placeholder="Result"
            style="margin: 0; width: 100%; box-sizing: border-box;"
        ></textarea>
    </div>

<!-- ========================= -->
<!-- Encryption Modal -->
<!-- ========================= -->

<div id="successModal" class="modal hidden">

    <div class="modal-content">

        <h2>Encryption Complete</h2>

        <p>Your message has been encrypted successfully.</p>

        <textarea id="modalOutput" class="modal-text" readonly></textarea>

        <button onclick="copyOutput()">
            Copy Message
        </button>

        <button onclick="shareMessage()">
            Share
        </button>

        <button onclick="clearAll(); closeModal();">
            Clear
        </button>

        <button onclick="closeModal()">
            Close
        </button>

    </div>

</div>

<!-- ========================= -->
<!-- Decryption Modal -->
<!-- ========================= -->

<div id="decryptModal" class="modal hidden">

    <div class="modal-content">

        <h2>Decryption Complete</h2>

        <p>Your message has been decrypted successfully.</p>

        <textarea id="decryptModalOutput" class="modal-text" readonly></textarea>

        <button onclick="copyDecrypted()">Copy Message</button>
        <button onclick="clearAll(); closeDecryptModal();">Clear</button>
        <button onclick="closeDecryptModal()">Close</button>

    </div>

</div>

<script src="script.js"></script>

<div id="notification"></div>

</body>
</html>
