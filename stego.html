<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steganography // Image Vault</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .stego-container {
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: #111;
            border: 1px solid var(--hacker, #00ff41);
            color: var(--hacker, #00ff41);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            min-height: 44px;
            touch-action: manipulation;
        }

        .tab-btn.active {
            background: var(--hacker, #00ff41);
            color: #000;
            font-weight: bold;
        }

        .panel {
            display: none;
            background: #111;
            border: 1px solid var(--hacker, #00ff41);
            padding: 20px;
            border-radius: 8px;
        }

        .panel.active {
            display: block;
        }

        input[type="file"] {
            margin: 15px 0;
            color: #fff;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #000;
            color: var(--hacker, #00ff41);
            border: 1px solid var(--hacker, #00ff41);
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            box-sizing: border-box;
            margin-bottom: 15px;
            resize: vertical;
        }

        .preview-img {
            max-width: 100%;
            max-height: 250px;
            margin: 15px 0;
            border: 1px dashed var(--hacker, #00ff41);
            display: none;
        }

        #download-btn {
            display: none;
            text-decoration: none;
            background: var(--hacker, #00ff41);
            color: #000;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container stego-container">
    <a href="arcade.html" style="text-decoration: none; float: left; font-size: 1.2rem;" title="Back to Arcade">🔒</a>
    <h1 style="clear: both;">Image Steganography</h1>
    <p>Hide secret messages inside PNG image pixels.</p>

    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('encode')">Encode Text into Image</button>
        <button class="tab-btn" onclick="switchTab('decode')">Extract Text from Image</button>
    </div>

    <!-- ENCODE PANEL -->
    <div style="margin-top: 15px;">
    <img id="encode-preview" class="preview-img" alt="Encoded Result Preview">
    <p id="save-instructions" style="display: none; font-size: 13px; color: #888; margin-top: 5px;">
        📱 <b>Mobile Users:</b> Press & hold the image above to select <b>"Save to Photos"</b> or tap below:
    </p>
    <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px;">
        <button id="share-btn" onclick="shareImage()" style="display: none; background: #00ffff; color: #000; font-weight: bold;">
            Share / Save Image
        </button>
        <a id="download-btn" download="stego_image.png">Download PNG</a>
    </div>
</div>

    <!-- DECODE PANEL -->
    <div id="decode-panel" class="panel">
        <h3>Select Encoded Image</h3>
        <input type="file" id="decode-file" accept="image/png">
        
        <button onclick="decodeMessage()">Extract Hidden Payload</button>

        <h3 style="margin-top: 20px;">Extracted Secret Message:</h3>
        <textarea id="decode-text" readonly placeholder="Decoded content will appear here..."></textarea>
    </div>
</div>

<canvas id="stego-canvas" style="display: none;"></canvas>

<script src="stego.js"></script>

</body>
</html>
