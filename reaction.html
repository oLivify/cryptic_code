<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Test</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reaction-box {
            width: 100%;
            max-width: 350px;
            height: 200px;
            margin: 20px auto;
            border: 2px solid var(--hacker, #00ff41);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
            background-color: #1a1a1a;
            color: var(--hacker, #00ff41);
        }

        .reaction-box.waiting {
            background-color: #331010;
            border-color: #ff3131;
            color: #ff3131;
        }

        .reaction-box.ready {
            background-color: var(--hacker, #00ff41);
            border-color: var(--hacker, #00ff41);
            color: #000;
        }

        .reaction-box h2 {
            margin: 0;
            font-size: 1.5rem;
            pointer-events: none;
        }

        .reaction-box p {
            margin: 8px 0 0 0;
            font-size: 0.9rem;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container" style="text-align: center;">
    <h1>Reaction Test</h1>
    <p>Best Time: <span id="best-score">--</span> ms</p>

    <div id="target-box" class="reaction-box" onclick="handleBoxClick()">
        <h2 id="box-title">Click to Start</h2>
        <p id="box-sub">Test your impulse speed</p>
    </div>

    <button onclick="window.location.href='arcade.html'" style="margin-top: 15px;">Back to Arcade</button>
</div>

<script src="reaction.js"></script>

</body>
</html>
