<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Match</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 75px);
            grid-gap: 12px;
            margin: 20px auto;
            justify-content: center;
            perspective: 1000px;
        }

        .card {
            width: 75px;
            height: 100px;
            background-color: #222;
            border: 2px solid var(--hacker, #00ff41);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.3s ease, background-color 0.3s;
            transform-style: preserve-3d;
        }

        .card.flipped {
            background-color: #111;
            box-shadow: 0 0 10px var(--hacker, #00ff41);
        }

        .card.matched {
            background-color: #003311;
            border-color: #00ff41;
            cursor: default;
            opacity: 0.7;
        }

        #game-status {
            font-size: 1.1rem;
            min-height: 1.5em;
            margin-top: 10px;
            color: var(--hacker, #00ff41);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container" style="text-align: center;">
    <h1>Card Match</h1>
    <p>Moves: <span id="moves">0</span></p>
    <div id="game-status">Find all matching symbol pairs</div>

    <div class="grid" id="card-grid"></div>

    <button onclick="resetGame()" style="margin-top: 15px;">Restart</button>
    <button onclick="window.location.href='arcade.html'" style="margin-top: 15px;">Back to Arcade</button>
</div>

<script src="cards.js"></script>

</body>
</html>
